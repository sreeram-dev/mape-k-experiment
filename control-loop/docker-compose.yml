version: "3.8"
services:
  prometheus:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: 'prom/prometheus:latest'
    networks:
      - overlay
      - mape-k
    ports:
      - '9090:9090'
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=http://localhost:9090"
        #      - '--storage.tsdb.path=/data'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
        #      - prometheus_data:/data
    links:
      - cadvisor
  alertmanager:
      platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
      image: prom/alertmanager
      volumes:
        - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
          #- alertmanager_data:/data
      networks:
        - mape-k
      command:
        - "--config.file=/etc/alertmanager/alertmanager.yml"
        - "--web.external-url=http://localhost:9093"
          #- '--storage.path=/data'
      ports:
        - '9093:9093'
  loki:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: 'grafana/loki:latest'
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki_config.yml:/etc/loki/loki.yml
    networks:
      mape-k:
      overlay:
          ipv4_address: ${LOKI_SERVER_IP:-172.29.0.10}
  grafana:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
    networks:
      - mape-k
  cadvisor:
    platform: ${CADVISOR_PLATFORM:-linux/amd64}
    image: 'google/cadvisor:latest'
    container_name: cadvisor
    ports:
      - '8080:8080'
    networks:
      - overlay
      - mape-k
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk/:ro
  adaptation:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: sreeramb93/adaptation-server
    build:
      context: ./adaptation
      dockerfile: Dockerfile
    command: /bin/sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && /start.sh"
    environment:
      ADAPTATION_DB_HOST: adaptation_db
      ADAPTATION_DB_PORT: 3309
      DATAPLANE_API_USERNAME: ${DATAPLANE_API_USERNAME:-dataplaneapi}
      DATAPLANE_API_PASSWORD: ${DATAPLANE_API_PASSWORD:-dataplane}
      DEBUG_TRUE: "TRUE"
    networks:
      - mape-k
      - overlay
    ports:
      - '8091:80'
    volumes:
      - ./adaptation:/app
      - ./adaptation/static:/app/static
      - ./adaptation/migrations:/app/migrations
    depends_on:
      adaptation_db:
        condition: service_healthy
    links:
      - adaptation_db
  adaptation_db:
    platform: ${DOCKER_PLATFORM:-linux/arm64/v8}
    image: mysql:8.0
    networks:
      - mape-k
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: adaptation
      MYSQL_USER: sreeram
      MYSQL_PASSWORD: adelaide7093
      MYSQL_TCP_PORT: 3309
    volumes:
      - adb_data:/var/lib/mysql/
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prometheus_data: {}
  alertmanager_data: {}
  grafana_data: {}
  badger_data: {}
  adb_data: {}
  adb_logs_data: {}

networks:
  mape-k:
    driver: bridge
  overlay:
    external: true
    name: ${DEMO_NETWORK_NAME:-demo-server_overlay}
